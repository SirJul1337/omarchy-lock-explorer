# A boot screen layout. Everything is centered; vertical positions are
# percent of the screen height. $USER and $HOST expand, colors are
# foreground / accent / dim / background or #RRGGBB, all keys optional.

# theme (plain color) | wallpaper (blurred + dimmed) | #RRGGBB | /path/to.png
background = theme
scanlines = off

# theme (your theme's unlock.png) | none | /path/to.png
logo = theme
logo_y = 36
logo_height = 120

title = Omarchy Linux
title_y = 18
title_size = 26
title_color = foreground

subtitle = $HOST
subtitle_y = 25
subtitle_size = 15
subtitle_color = dim

# pill | line | none -- where the passphrase bullets go
entry = pill
entry_y = 72
entry_width = 380

